const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const raw=b64(P),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
const SALT=btoa(String.fromCharCode(...salt));
// 비밀번호 자체는 어디에도 저장하지 않는다. '기억'은 이 기기에 복호화 키만 남기고,
// 비밀번호를 바꾸면(서버측 재암호화) 그 키는 자동으로 무효가 된다.
const store={get(){try{const v=sessionStorage.getItem("wrapkey")||localStorage.getItem("wrapkey");return v?JSON.parse(v):null}catch(e){return null}},
  put(k,remember){try{const v=JSON.stringify({s:SALT,k});sessionStorage.setItem("wrapkey",v);if(remember)localStorage.setItem("wrapkey",v)}catch(e){}},
  clear(){try{["wrapkey","wrappw"].forEach(n=>{sessionStorage.removeItem(n);localStorage.removeItem(n)})}catch(e){}}};
try{localStorage.removeItem("wrappw");sessionStorage.removeItem("wrappw")}catch(e){}
async function show(key){
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  const html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close();
}
async function go(pw,remember){
  const m=document.getElementById("msg");m.textContent="확인 중…";
  try{
    const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},true,["decrypt"]);
    const kraw=new Uint8Array(await crypto.subtle.exportKey("raw",key));
    await show(key);
    store.put(btoa(String.fromCharCode(...kraw)),remember);
  }catch(e){ store.clear(); m.textContent="비밀번호가 맞지 않습니다"; }
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();go(pw.value,rem.checked)});
(async()=>{const sv=store.get(); if(!sv||sv.s!==SALT){ if(sv) store.clear(); return; }
  try{ await show(await crypto.subtle.importKey("raw",b64(sv.k),"AES-GCM",false,["decrypt"])); }catch(e){ store.clear(); }})();
